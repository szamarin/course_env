[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "course-labs"
version = "0.1.0"
description = "Hands-on labs and interactive workshops powered by marimo and uv"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "marimo>=0.9.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "polars>=1.0.0",
    "pyarrow>=16.0.0",
    "altair>=5.3.0",
    "matplotlib>=3.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
lab = "course_utils.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/course_utils"]
